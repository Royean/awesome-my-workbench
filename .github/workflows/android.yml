name: Android test package
on:
  push:
    paths:
      - 'android/**'
      - 'scripts/build-android-debug.sh'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'android/**'
      - 'scripts/build-android-debug.sh'
      - '.github/workflows/android.yml'
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Prepare Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Build and check Android test packages
        run: bash scripts/build-android-debug.sh
      - name: Record package checksums and source
        run: |
          git rev-parse HEAD > android/app/build/outputs/apk/SOURCE_COMMIT.txt
          sha256sum android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk > android/app/build/outputs/apk/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: workbench-android-${{ github.sha }}
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            android/app/build/outputs/apk/SOURCE_COMMIT.txt
            android/app/build/outputs/apk/SHA256SUMS.txt
            android/app/build/reports/lint-results-debug.html
            android/app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: error
          retention-days: 14
