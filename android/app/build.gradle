plugins { id 'com.android.application' }
android {
    namespace 'dev.awesome.myworkbench'
    compileSdk 36
    defaultConfig {
        applicationId 'dev.awesome.myworkbench'
        minSdk 26
        targetSdk 36
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        versionCode 704
        versionName '0.7.4'
    }
    signingConfigs {
        release {
            if (System.getenv('WORKBENCH_KEYSTORE')) {
                storeFile file(System.getenv('WORKBENCH_KEYSTORE'))
                storePassword System.getenv('WORKBENCH_STORE_PASSWORD')
                keyAlias 'awesome-my-workbench'
                keyPassword System.getenv('WORKBENCH_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
        debug { applicationIdSuffix '.debug' }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

dependencies {
    implementation "androidx.health.connect:connect-client:1.1.0"
    implementation "androidx.activity:activity-ktx:1.10.1"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0"
    androidTestImplementation "androidx.test:runner:1.6.2"
    androidTestImplementation "androidx.test.ext:junit:1.2.1"
    testImplementation "junit:junit:4.13.2"
}
