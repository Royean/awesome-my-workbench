<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>知衡原生 v1 原型</title>
<style>
:root{--ink:#263e39;--green:#287360;--green-c:#cfe8de;--bg:#f5f6f3;--surface:#fff;--hint:#5f6f68;--line:#e7ece8;--error:#9f4c3a;--err-c:#f6e1da;--warn-c:#fbf0dc;--warn:#7a5212}
*{box-sizing:border-box;margin:0}body{background:#d9ddd8;font:14px/1.5 system-ui,"PingFang SC","Noto Sans SC",sans-serif;color:var(--ink);display:flex;gap:24px;padding:24px;flex-wrap:wrap}
body.shot{padding:0;background:var(--bg)}body.shot nav.idx{display:none}
nav.idx{width:220px}nav.idx a{display:block;padding:8px;color:var(--green);text-decoration:none;min-height:40px}
.phone{width:390px;height:844px;background:var(--bg);position:relative;overflow:hidden;border-radius:28px;box-shadow:0 8px 30px #0003}body.shot .phone{border-radius:0;box-shadow:none}
.sb{height:36px;display:flex;justify-content:space-between;padding:8px 24px;font-size:12px;font-weight:600}
.ab{height:64px;display:flex;align-items:center;padding:0 4px 0 16px;gap:8px}.ab h1{font-size:22px;font-weight:600;flex:1;display:flex;align-items:center;gap:8px}
.ib{width:48px;height:48px;border-radius:24px;border:0;background:none;font-size:20px;color:var(--ink);cursor:pointer}
.chip{height:40px;padding:0 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface);display:inline-flex;align-items:center;gap:6px;font-size:14px;color:var(--ink);cursor:pointer}
.content{padding:0 16px;height:calc(844px - 36px - 64px - 80px);overflow:auto}
.card{background:var(--surface);border-radius:16px;padding:16px;margin-bottom:12px}.card h3{font-size:16px;font-weight:600;margin-bottom:8px}
.hint{color:var(--hint);font-size:14px}.small{font-size:12px;color:var(--hint)}
.row{display:flex;align-items:center;gap:12px;min-height:56px;border-top:1px solid var(--line)}.row:first-of-type{border-top:0}.row .t{flex:1}.row .ic{width:40px;height:40px;border-radius:20px;background:var(--green-c);display:grid;place-items:center}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}.quick button{height:72px;border:0;border-radius:16px;background:var(--surface);color:var(--ink);font-size:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer}.quick b{font-size:22px}
.nb{position:absolute;bottom:0;left:0;right:0;height:80px;background:#eef1ec;display:flex}.nb a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:12px;color:var(--hint);text-decoration:none}
.nb .pill{width:64px;height:32px;border-radius:16px;display:grid;place-items:center;font-size:18px}.nb a.on{color:var(--ink);font-weight:700}.nb a.on .pill{background:var(--green-c)}
.fab{position:absolute;right:16px;bottom:96px;height:56px;padding:0 20px;border-radius:16px;background:var(--green);color:#fff;border:0;font-size:16px;display:flex;gap:8px;align-items:center;box-shadow:0 3px 8px #0003;cursor:pointer}
.btn{height:48px;border-radius:24px;border:0;background:var(--green);color:#fff;font-size:16px;font-weight:600;width:100%;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer}.btn.t{background:none;color:var(--green);width:auto;padding:0 16px}
.field{margin-bottom:16px}.field label{display:block;font-size:12px;color:var(--hint);margin-bottom:4px}.field .in{height:56px;border:1px solid #8a9a93;border-radius:4px;padding:0 16px;display:flex;align-items:center;background:var(--surface);font-size:16px}
.field.err .in{border:2px solid var(--error)}.field.err .msg{color:var(--error);font-size:12px;margin-top:4px;padding-left:16px}.field .sup{font-size:12px;color:var(--hint);margin-top:4px;padding-left:16px}
.spin{width:18px;height:18px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:r 1s linear infinite;display:inline-block}@keyframes r{to{transform:rotate(1turn)}}
.banner{margin:0 16px 12px;padding:12px 16px;border-radius:12px;display:flex;gap:8px;align-items:center;font-size:14px}.banner.off{background:var(--warn-c);color:var(--warn)}.banner.fail{background:var(--err-c);color:var(--error)}.banner .btn.t{height:40px;color:inherit;font-weight:700;margin-left:auto}
.badge{font-size:12px;padding:2px 8px;border-radius:8px;background:var(--warn-c);color:var(--warn)}
.sk{background:linear-gradient(90deg,#e8ebe6,#f2f4f0,#e8ebe6);background-size:200%;animation:sk 1.4s infinite;border-radius:8px}@keyframes sk{to{background-position:-200% 0}}
.scrim{position:absolute;inset:0;background:#0006}.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--surface);border-radius:28px 28px 0 0;padding:8px 16px 24px}.sheet .h{width:32px;height:4px;border-radius:2px;background:#8a9a93;margin:8px auto 16px}
.opt{display:flex;align-items:center;gap:12px;min-height:56px;padding:0 12px;border-radius:12px;cursor:pointer}.opt.on{background:var(--green-c);font-weight:700}.opt .ck{margin-left:auto}
.seg{display:flex;border:1px solid #8a9a93;border-radius:20px;overflow:hidden;margin-bottom:16px}.seg span{flex:1;height:40px;display:grid;place-items:center;font-size:14px}.seg span.on{background:var(--green-c);font-weight:700}
.dlg{position:absolute;left:40px;right:40px;top:300px;background:#f3f6f2;border-radius:28px;padding:24px}.dlg h2{font-size:22px;font-weight:500;margin-bottom:16px}.dlg .acts{display:flex;justify-content:flex-end;margin-top:24px}
.snack{position:absolute;left:16px;right:16px;bottom:96px;background:#2f3a36;color:#fff;border-radius:8px;padding:14px 16px;font-size:14px;display:flex;align-items:center;gap:8px}.snack button{margin-left:auto;background:none;border:0;color:#a8dcc6;font-weight:700;min-height:48px;padding:0 8px}.ftabs{display:flex;gap:8px;overflow-x:auto;padding:4px 0 12px}.ftabs .chip.on{background:var(--green-c);border-color:var(--green-c);font-weight:700}.gh{font-size:14px;font-weight:700;color:var(--hint);margin:12px 0 4px}.danger{background:var(--error)!important}.scr{display:none}.scr.on{display:block}
</style></head><body>
<nav class="idx"><b>屏幕 / 状态</b></nav>
<div class="phone" id="phone"></div>
<script>
const S={};const nb=(on)=>`<div class="nb">${[['今天','☀','today'],['记录','☰','records']].map(([t,i,h],k)=>`<a href="#${h}" class="${k==on?'on':''}"><span class="pill">${k==on?'●':i}</span>${t}</a>`).join('')}</div>`;
const sb=`<div class="sb"><span>9:41</span><span>▲ ▮▮</span></div>`;
const ab=(extra='')=>`<div class="ab"><h1>今天${extra}</h1><button class="chip" onclick="go('switcher')">健康 · 个人空间 ▾</button><button class="ib" aria-label="同步状态">⟳</button></div>`;
const quick=`<div class="quick"><button onclick="go('form-meal')"><b>🍚</b>记一餐</button><button onclick="go('form-exercise')"><b>🏃</b>记运动</button><button onclick="go('form-metric')"><b>⚖</b>记指标</button><button onclick="go('form-water')"><b>💧</b>记饮水</button></div>`;
const list=(pending)=>`<div class="card"><h3>今日记录</h3>
<div class="row"><span class="ic">🍚</span><div class="t">午餐 · 番茄炒蛋、米饭<div class="small">12:20</div></div>${pending?'<span class="badge">⏱ 待同步</span>':''}</div>
<div class="row"><span class="ic">🏃</span><div class="t">步行 30 分钟<div class="small">08:10</div></div></div>
<div class="row"><span class="ic">⚖</span><div class="t">体重 62.4 kg<div class="small">07:30</div></div></div>
<div class="row"><span class="ic">💧</span><div class="t">饮水 1,200 / 2,000 ml<div class="small">累计 · 目标取自设置，无则 2000</div></div></div></div>`;
const summary=`<div class="card"><h3>11月1日 周日</h3><div class="hint">已记 3 餐中 1 餐 · 运动 30 分钟 · 饮水 60%</div></div>`;
const today=(o={})=>sb+`<div class="ab"><h1>今天${o.sync?'<span class="spin" style="width:16px;height:16px;color:var(--hint)" aria-label="同步中"></span>':''}</h1><button class="chip" onclick="go('switcher')">${o.wb||'健康'} · 个人空间 ▾</button><button class="ib" aria-label="账号" onclick="go('account')"><span style="width:32px;height:32px;border-radius:16px;background:var(--green-c);display:inline-grid;place-items:center;font-size:14px;font-weight:700">我</span></button></div>`+(o.banner||'')+`<div class="content">${o.body||summary+quick+list(o.pending)}</div>${o.nofab?'':'<button class="fab" onclick="go(\'add-sheet\')">＋ 记录</button>'}${o.snack||''}`+nb(0);
S['login']=['登录 · 空闲',()=>login('')];
S['login-loading']=['登录 · 登录中',()=>login('load')];
S['login-slow']=['登录 · 3s 网络较慢',()=>login('slow')];
S['login-timeout']=['登录 · 15s 超时',()=>login('timeout')];
S['login-error']=['登录 · 密码错误',()=>login('err')];
function login(s){return sb+`<div style="padding:48px 24px"><div style="width:64px;height:64px;border-radius:16px;background:var(--green);color:#fff;display:grid;place-items:center;font-size:28px;font-weight:700">衡</div><h1 style="font-size:28px;margin:24px 0 4px">登录知衡</h1><p class="hint" style="margin-bottom:32px">登录后自动保持 30 天</p>
<div class="field"><label>邮箱</label><div class="in">me@example.com</div></div>
<div class="field ${s=='err'?'err':''}"><label>密码</label><div class="in">••••••••<span style="margin-left:auto">👁</span></div>${s=='err'?'<div class="msg">邮箱或密码不正确</div>':''}</div>
<button class="btn" style="width:100%;margin-top:8px" ${s&&s!='err'&&s!='timeout'?'disabled':''} onclick="go('login-loading')">${s=='load'||s=='slow'?'<span class="spin"></span>登录中…':'登录'}</button>
<p style="min-height:24px;margin-top:12px;text-align:center;font-size:14px;color:${s=='timeout'?'var(--error)':'var(--hint)'}" role="status">${s=='slow'?'网络较慢，正在连接…':s=='timeout'?'连接超时，请重试':''}</p>
<p class="small" style="margin-top:120px;text-align:center">本机缓存仅属于当前账号，退出登录即清除</p></div>`}
S['today']=['今天 · 已加载',()=>today()];
S['today-syncing']=['今天 · 同步中',()=>today({sync:1})];
S['today-offline']=['今天 · 离线 + 待同步',()=>today({pending:1,banner:'<div class="banner off" role="status">☁ 离线中，记录会在联网后同步</div>'})];
S['today-syncfail']=['今天 · 同步失败',()=>today({pending:1,banner:'<div class="banner fail" role="alert">⚠ 1 条记录同步失败<button class="btn t" onclick="go(\'today-syncing\')">重试</button></div>'})];
S['today-finance']=['今天 · 金融（只读）',()=>today({wb:'金融',nofab:1,body:`<div class="card"><h3>11月1日 周日</h3><div class="hint">金融工作台 · 只读</div></div><div class="card"><h3>最近备忘</h3><div class="row"><span class="ic">✎</span><div class="t">季度定投计划复盘<div class="small">10月30日</div></div></div><div class="row"><span class="ic">✎</span><div class="t">信用卡账单日改到 5 号<div class="small">10月28日</div></div></div></div><div class="card"><h3>待办</h3><div class="row"><span class="ic">☐</span><div class="t">11月10日前缴房贷<div class="small">截止 11月10日</div></div></div><div class="row"><span class="ic">☐</span><div class="t">整理年度保险单<div class="small">无截止</div></div></div></div><p class="hint" style="text-align:center;padding:24px 0">金融记录暂时请在网页版添加</p>`})];
S['sync-conflict']=['同步冲突 · Snackbar',()=>today({snack:'<div class="snack" role="status">『早餐』已在别处修改，已更新为最新内容<button>知道了</button></div>'})];
const recs=(f)=>{const all=[['11月1日 周日',[['meal','🍚','午餐 · 番茄炒蛋、米饭','12:20'],['water','💧','饮水 300 ml','10:00'],['exercise','🏃','步行 30 分钟','08:10'],['metric','⚖','体重 62.4 kg','07:30']]],['10月31日 周六',[['meal','🍚','晚餐 · 清蒸鱼、青菜','18:40'],['exercise','🏃','骑行 45 分钟','16:00'],['metric','⚖','血压 118/76 mmHg','08:00'],['meal','🍚','早餐 · 燕麦牛奶','07:50']]]];
return sb+`<div class="ab"><h1>记录</h1><button class="chip" onclick="go('switcher')">健康 · 个人空间 ▾</button></div><div class="content"><div class="ftabs" role="tablist">${[['','全部'],['meal','一餐'],['exercise','运动'],['metric','指标'],['water','饮水']].map(([k,t])=>`<button class="chip ${k==f?'on':''}" role="tab" aria-selected="${k==f}" onclick="go('${k?'records-filtered':'records'}')">${k==f?'✓ ':''}${t}</button>`).join('')}</div>${all.map(([d,rs])=>{rs=rs.filter(r=>!f||r[0]==f);return rs.length?`<div class="gh">${d}</div><div class="card">${rs.map(r=>`<div class="row" onclick="go('form-meal-edit')"><span class="ic">${r[1]}</span><div class="t">${r[2]}<div class="small">${r[3]}</div></div><span class="hint">›</span></div>`).join('')}</div>`:''}).join('')}</div><button class="fab" onclick="go('add-sheet')">＋ 记录</button>`+nb(1)};
S['records']=['记录 · 全部',()=>recs('')];
S['records-filtered']=['记录 · 筛选一餐',()=>recs('meal')];
S['today-empty']=['今天 · 空状态',()=>today({body:summary.replace('已记 3 餐中 1 餐 · 运动 30 分钟 · 饮水 60%','今天还没有记录')+quick+`<div class="card" style="text-align:center;padding:32px 16px"><div style="font-size:40px">🌱</div><h3>从第一条记录开始</h3><p class="hint">点上方快捷按钮或右下角「记录」</p></div>`})];
S['today-skeleton']=['今天 · 首次启动骨架屏',()=>today({body:`<div class="card"><div class="sk" style="height:20px;width:40%;margin-bottom:12px"></div><div class="sk" style="height:16px;width:80%"></div></div><div class="quick">${'<div class="sk" style="height:72px;border-radius:16px"></div>'.repeat(4)}</div><div class="card">${'<div style="display:flex;gap:12px;margin:12px 0"><div class="sk" style="width:40px;height:40px;border-radius:20px"></div><div style="flex:1"><div class="sk" style="height:16px;margin-bottom:8px"></div><div class="sk" style="height:12px;width:40%"></div></div></div>'.repeat(4)}</div>`})];
const sheetOver=(base,inner)=>base+`<div class="scrim" onclick="go('today')"></div><div class="sheet"><div class="h"></div>${inner}</div>`;
S['add-sheet']=['新建记录 · 底部表单',()=>sheetOver(today(),`<h3 style="font-size:18px;margin-bottom:8px">记录什么？</h3>${[['🍚','记一餐','form-meal'],['🏃','记运动','form-exercise'],['⚖','记指标（体重/血压/血糖…）','form-metric'],['💧','记饮水','form-water']].map(([i,t,g])=>`<div class="opt" onclick="go('${g}')"><span class="ic" style="font-size:20px">${i}</span>${t}</div>`).join('')}<p class="small" style="padding:12px">用药、就诊、附件请在网页版记录</p>`)];
S['switcher']=['切换工作台 / 空间',()=>sheetOver(today(),`<h3 style="font-size:18px;margin-bottom:8px">工作台</h3><div class="opt on">❤ 健康<span class="ck">✓</span></div><div class="opt">¥ 金融</div><h3 style="font-size:18px;margin:16px 0 8px">数据空间</h3><div class="seg"><span class="on">✓ 个人空间</span><span>示例空间</span></div><p class="small">示例空间为演示数据，可随意修改</p>`)];
const form=(title,fields,o={})=>sb+`<div class="ab"><button class="ib" aria-label="关闭" onclick="go('${o.dirty?'discard':'today'}')">✕</button><h1>${title}</h1><button class="btn t" onclick="go('today')">保存</button></div><div class="content" style="height:auto">${fields}${o.del?'<button class="btn t" style="color:var(--error);margin-top:16px">删除记录</button>':''}</div>`;
const dateF=(err)=>`<div class="field ${err?'err':''}"><label>日期时间</label><div class="in">${err?'2026-11-08':'2026-11-01'} 12:20<span style="margin-left:auto">📅</span></div>${err?'<div class="msg">日期不能晚于今天</div>':''}</div>`;
S['form-meal']=['记一餐',()=>form('记一餐',`<div class="seg"><span>早餐</span><span class="on">✓ 午餐</span><span>晚餐</span><span>加餐</span></div>${dateF()}<div class="field"><label>吃了什么</label><div class="in">番茄炒蛋、米饭</div></div><div class="field"><label>备注（可选）</label><div class="in hint">口味、份量、感受</div></div>`,{dirty:1})];
S['form-meal-edit']=['编辑一餐 · 日期错误',()=>form('编辑一餐',`<div class="seg"><span>早餐</span><span class="on">✓ 午餐</span><span>晚餐</span><span>加餐</span></div>${dateF(1)}<div class="field"><label>吃了什么</label><div class="in">番茄炒蛋、米饭</div></div>`,{dirty:1,del:1})];
S['form-exercise']=['记运动',()=>form('记运动',`<div class="field"><label>运动类型</label><div class="in">步行 ▾</div></div>${dateF()}<div class="field"><label>时长（分钟）</label><div class="in">30</div><div class="sup">1–1440 分钟</div></div>`)];
S['form-metric']=['记指标',()=>form('记指标',`<div class="seg"><span class="on">✓ 体重</span><span>血压</span><span>血糖</span><span>睡眠</span><span>心率</span></div>${dateF()}<div class="field"><label>体重（kg）</label><div class="in">62.4</div><div class="sup">上次 62.8 kg · 10月31日</div></div>`)];
S['form-water']=['记饮水',()=>form('记饮水',`${dateF()}<div style="display:flex;gap:8px;margin-bottom:16px">${[200,300,500].map(v=>`<button class="chip" style="flex:1;justify-content:center;height:48px">+${v} ml</button>`).join('')}</div><div class="field"><label>饮水量（ml）</label><div class="in">300</div><div class="sup">今日已喝 1,200 ml</div></div>`)];
S['discard']=['未保存 · 放弃确认',()=>S['form-meal'][1]()+`<div class="scrim"></div><div class="dlg" role="alertdialog"><h2>放弃未保存的内容？</h2><p class="hint">刚才填写的内容不会保留。</p><div class="acts"><button class="btn t" onclick="go('form-meal')">继续编辑</button><button class="btn t" style="color:var(--error)" onclick="go('today')">放弃</button></div></div>`];
S['account']=['账号 · 缓存',()=>sb+`<div class="ab"><button class="ib" aria-label="返回" onclick="go('today')">←</button><h1>账号</h1></div><div class="content"><div class="card"><h3>me@example.com</h3><p class="hint">登录有效期自动续期 30 天</p></div><div class="card"><div class="row"><div class="t">本机缓存<div class="small">仅属于当前账号；切换或退出账号时清除</div></div></div><div class="row"><div class="t">待同步<div class="small">2 条</div></div></div></div><div class="card"><div class="row hint"><div class="t">备忘待办 · 用药 · 设置 · 邀请成员</div><span class="small">网页版 ↗</span></div></div><button class="btn t" style="color:var(--error)" onclick="go('logout')">退出登录</button></div>`];
S['logout']=['退出登录 · 有未同步',()=>S['account'][1]()+`<div class="scrim"></div><div class="dlg" role="alertdialog"><h2>退出登录？</h2><p class="hint">有 2 条记录还没同步，退出后会从这台手机上删除</p><div style="display:flex;flex-direction:column;gap:8px;margin-top:24px"><button class="btn" onclick="go('today-syncing')">先同步</button><button class="btn t" style="color:var(--error);width:100%;height:48px" onclick="go('logout-confirm2')">仍然退出</button><button class="btn t" style="width:100%;height:48px" onclick="go('account')">取消</button></div></div>`];
S['logout-confirm2']=['退出登录 · 二次确认',()=>S['account'][1]()+`<div class="scrim"></div><div class="dlg" role="alertdialog"><h2>确定删除未同步记录？</h2><p class="hint">2 条未同步记录将永久删除，无法恢复。</p><div class="acts" style="gap:8px"><button class="btn t" onclick="go('logout')">返回</button><button class="btn danger" style="width:auto;padding:0 20px" onclick="go('login')">删除并退出</button></div></div>`];
function go(k){location.hash=k}
function render(){const k=location.hash.slice(1)||'login';document.getElementById('phone').innerHTML=(S[k]||S.login)[1]()}
